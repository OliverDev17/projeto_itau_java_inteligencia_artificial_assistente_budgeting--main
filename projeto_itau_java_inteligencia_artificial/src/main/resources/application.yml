spring:
  application:
    name: assistente-budgeting
  datasource:
    url: jdbc:mysql://localhost:3306/budgeting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
      audio:
        transcription:
          options:
            model: whisper-1
        speech:
          options:
            model: tts-1
            voice: alloy

  cloud:
    openfeign:
      client:
        config:
          openai-audio:
            default-request-headers:
              Authorization: "Bearer ${spring.ai.openai.api-key}"

server:
  port: 8080
